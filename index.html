<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courtside Stats V2</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#17243b;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#14283f;color:white;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}h1{font-size:22px;margin:0}main{max-width:1500px;margin:auto;padding:15px}.card{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 6px #0001}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:8px 0}button,input,select{font:inherit;padding:9px;border:1px solid #c7d1df;border-radius:8px;background:white;color:inherit}button{cursor:pointer;min-height:42px}button:hover{filter:brightness(.96)}button.primary{background:#1764bc;color:white;border:0}button.danger{color:#b02929}input{max-width:240px}label{font-size:13px;color:#596477}h2{font-size:19px;margin:0 0 12px}.muted{color:#687487;font-size:13px}.teamcards{display:flex;gap:12px;flex-wrap:wrap}.teamcard{min-width:220px;flex:1;border:1px solid #d5dfed;border-radius:12px;padding:14px}.teamcard strong{display:block;font-size:18px}.hidden{display:none!important}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#eaf0f7}th:first-child,td:first-child{position:sticky;left:0;background:white;z-index:1;min-width:130px}th:first-child{background:#eaf0f7}.stat{background:#d9eaff;border-color:#8db7e5;font-weight:800;min-width:44px}.cell{display:flex;align-items:center;gap:8px}.score{font-size:38px;font-weight:800}.pill{background:#e8eef7;border-radius:20px;padding:7px 12px}dialog{border:0;border-radius:12px;width:min(92vw,560px);box-shadow:0 8px 40px #0005}dialog::backdrop{background:#0007}.event{display:flex;justify-content:space-between;gap:12px;padding:7px;border-bottom:1px solid #eee;align-items:center}.dark{background:#101824;color:#e8eef7}.dark .card,.dark .teamcard,.dark dialog,.dark td:first-child{background:#1e2c3e;color:#e8eef7}.dark input,.dark select,.dark button{background:#263a51;color:#fff}.dark th,.dark th:first-child{background:#33485d}.dark .stat{background:#285b96}.dark label,.dark .muted{color:#afbdd0}</style></head><body><header><h1>🏀 Courtside Stats <small style="font-size:12px">V2</small></h1><div><button id="homeBtn">Teams</button> <button id="themeBtn">◐ Theme</button> <button id="csvBtn">Export CSV</button> <button id="backupBtn">Backup</button> <button id="restoreBtn">Restore</button><input type="file" id="restoreFile" accept="application/json" hidden></div></header><main><div id="dashboard"><section class="card"><h2>My teams</h2><div id="teamCards" class="teamcards"></div><div class="row"><button id="addTeam" class="primary">+ Create team</button><button id="managePlayers">Player directory</button></div></section></div><div id="workspace" class="hidden"><section class="card"><div class="row"><button id="backBtn">← Teams</button><h2 id="teamTitle" style="margin:0"></h2><button id="editTeam">Edit team</button><button id="addSeason">+ Competition / season</button></div><div class="row"><label>Competition / season</label><select id="seasonSelect"></select><button id="rosterBtn">Manage roster</button><button id="newGame" class="primary">+ New game</button><label>Game</label><select id="gameSelect"></select></div></section><div id="gameArea" class="hidden"><section class="card"><div class="row" style="justify-content:space-between"><div><div id="homeName" class="muted"></div><span id="homeScore" class="score">0</span></div><div class="score">–</div><div><div id="oppName" class="muted"></div><span id="oppScore" class="score">0</span></div><div>Opposition <button data-opp="1">+1</button> <button data-opp="2">+2</button> <button data-opp="3">+3</button></div></div></section><section class="card"><div class="row"><label>Period</label><select id="periodSelect"></select><button id="nextPeriod">Next period →</button><label><input type="checkbox" id="clockEnabled"> Clock</label><span id="clockDisplay" class="pill">00:00</span><button id="clockToggle">Start / Pause</button><button id="undoBtn" class="danger">↶ Undo last</button><button id="columnsBtn">Columns</button></div></section><section class="card"><h2>Player grid</h2><p class="muted">Tap + to record a statistic. Scroll horizontally for more columns.</p><div class="scroll"><table id="statsGrid"></table></div></section><section class="card"><h2>Event history</h2><div id="eventHistory"></div></section></div></div><p class="muted">Saves automatically on this device. Back up regularly. Data on different devices does not sync automatically.</p></main><dialog id="modal"><div id="modalBody"></div><div class="row" style="justify-content:flex-end"><button id="closeModal">Close</button></div></dialog><script>
'use strict';const K='courtside-v2',STATS=['2PM','2PX','3PM','3PX','FTM','FTX','REB','AST','STL','BLK','TO','FOUL'],NAMES={'2PM':'2PT made','2PX':'2PT missed','3PM':'3PT made','3PX':'3PT missed','FTM':'FT made','FTX':'FT missed',REB:'Rebound',AST:'Assist',STL:'Steal',BLK:'Block',TO:'Turnover',FOUL:'Foul'};const id=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(K))||null}catch{}if(!db||!Array.isArray(db.teams))db={teams:[],players:[],seasons:[],rosters:[],games:[],activeTeam:null,activeSeason:null,activeGame:null,dark:false,columns:[...STATS]};let seconds=0,timer=null;const team=()=>db.teams.find(x=>x.id===db.activeTeam),season=()=>db.seasons.find(x=>x.id===db.activeSeason),game=()=>db.games.find(x=>x.id===db.activeGame),roster=()=>db.rosters.filter(r=>r.seasonId===db.activeSeason&&r.teamId===db.activeTeam),players=()=>roster().filter(r=>r.active).map(r=>({...db.players.find(p=>p.id===r.playerId),number:r.number})).filter(p=>p.id);function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch{alert('Storage unavailable. Export a backup.')}}function popup(html){$('modalBody').innerHTML=html;$('modal').showModal()}function field(id,label,value=''){return `<label>${label}<br><input id="${id}" value="${esc(value)}" required></label>`}function option(arr,selected){return arr.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.label||x.name)}</option>`).join('')}function render(){document.body.classList.toggle('dark',db.dark);$('dashboard').classList.toggle('hidden',!!team());$('workspace').classList.toggle('hidden',!team());$('teamCards').innerHTML=db.teams.length?db.teams.map(t=>`<div class="teamcard"><strong>${esc(t.name)}</strong><p class="muted">${db.seasons.filter(s=>s.teamId===t.id).length} competition / seasons</p><button data-open-team="${t.id}" class="primary">Open team</button></div>`).join(''):'<p class="muted">No teams yet. Create your first team.</p>';if(!team())return;$('teamTitle').textContent=team().name;const ss=db.seasons.filter(s=>s.teamId===db.activeTeam);if(!ss.some(s=>s.id===db.activeSeason))db.activeSeason=ss[0]?.id||null;$('seasonSelect').innerHTML=ss.length?option(ss.map(s=>({...s,label:s.competition+' · '+s.name})),db.activeSeason):'<option value="">Create a season</option>';$('seasonSelect').value=db.activeSeason||'';const gg=db.games.filter(g=>g.teamId===db.activeTeam&&g.seasonId===db.activeSeason);if(!gg.some(g=>g.id===db.activeGame))db.activeGame=null;$('gameSelect').innerHTML='<option value="">Select game</option>'+option(gg.map(g=>({...g,label:g.date+' vs '+g.opponent})),db.activeGame);$('gameSelect').value=db.activeGame||'';$('gameArea').classList.toggle('hidden',!game());if(!game())return;const g=game();$('homeName').textContent=team().name;$('oppName').textContent=g.opponent;$('homeScore').textContent=g.events.reduce((n,e)=>n+(e.playerId?Number(e.points||0):0),0);$('oppScore').textContent=g.events.reduce((n,e)=>n+(e.type==='OPP'?Number(e.points||0):0),0);$('periodSelect').innerHTML=Array.from({length:g.format},(_,i)=>`<option value="${i+1}">${g.format===2?'Half':'Q'}${i+1}</option>`).join('');$('periodSelect').value=g.period;$('clockEnabled').checked=!!g.clockEnabled;$('clockDisplay').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');const pp=g.playerSnapshot||[];let html='<thead><tr><th>Player</th><th>PTS</th>'+db.columns.map(k=>`<th>${k}</th>`).join('')+'</tr></thead><tbody>';for(const p of pp){let counts={};for(const e of g.events.filter(e=>e.playerId===p.id))counts[e.type]=(counts[e.type]||0)+1;let pts=(counts['2PM']||0)*2+(counts['3PM']||0)*3+(counts.FTM||0);html+=`<tr><td>${esc(p.number?'#'+p.number+' ':'')}${esc(p.name)}</td><td><strong>${pts}</strong></td>`+db.columns.map(k=>`<td><div class="cell"><span>${counts[k]||0}</span><button class="stat" data-stat="${k}" data-player="${p.id}">+</button></div></td>`).join('')+'</tr>'}html+='</tbody>';$('statsGrid').innerHTML=html;$('eventHistory').innerHTML=g.events.length?[...g.events].reverse().map(e=>`<div class="event"><span class="muted">${esc(e.period)} · ${new Date(e.at).toLocaleTimeString()} · ${esc(pp.find(p=>p.id===e.playerId)?.name||'Opposition')} · ${esc(e.type==='OPP'?'+'+e.points:NAMES[e.type]||e.type)}</span><span><button data-edit-event="${e.id}">Edit</button> <button data-delete-event="${e.id}" class="danger">Delete</button></span></div>`).join(''):'<p class="muted">No events recorded yet.</p>';}
function addEvent(type,playerId=null){if(!game())return;const points=type==='2PM'?2:type==='3PM'?3:type==='FTM'?1:0;game().events.push({id:id(),type,playerId,points,period:game().period,at:new Date().toISOString(),clock:game().clockEnabled?seconds:null});save();render()}function stopClock(){clearInterval(timer);timer=null}function resetClock(){stopClock();seconds=0}
$('addTeam').onclick=()=>popup('<h2>Create team</h2>'+field('teamName','Team name')+'<p><button id="saveTeam" class="primary">Create</button></p>');$('editTeam').onclick=()=>popup('<h2>Edit team</h2>'+field('teamName','Team name',team().name)+'<p><button id="saveTeam" class="primary">Save</button></p>');$('addSeason').onclick=()=>popup('<h2>New competition / season</h2>'+field('competitionName','Competition (e.g. VJBL)')+' '+field('seasonName','Season (e.g. 2026/27)')+'<p class="muted">Each new season starts with an empty roster.</p><button id="saveSeason" class="primary">Create</button>');$('managePlayers').onclick=showPlayers;function showPlayers(){popup('<h2>Player directory</h2><p class="muted">Profiles are shared across teams.</p>'+field('playerName','Player name')+'<p><button id="savePlayer" class="primary">Add player</button></p><div>'+db.players.map(p=>`<div class="event">${esc(p.name)} <button data-rename-player="${p.id}">Rename</button></div>`).join('')+'</div>')}
function showRoster(){if(!season())return alert('Create a competition and season first.');popup('<h2>Manage roster</h2><p class="muted">Choose an existing player. Jersey numbers are specific to this roster.</p><div class="row"><select id="rosterPlayer">'+option(db.players.filter(p=>!roster().some(r=>r.playerId===p.id)))+'</select><input id="jersey" placeholder="Jersey #" style="width:100px"><button id="addRosterPlayer" class="primary">Add to roster</button></div><button id="newDirectoryPlayer">+ Create player</button><h3>Current roster</h3>'+roster().map(r=>{const p=db.players.find(p=>p.id===r.playerId);return `<div class="event"><span>${esc(p?.name)} · #${esc(r.number||'—')} ${r.active?'':'(inactive)'}</span><span><button data-toggle-roster="${r.playerId}">${r.active?'Deactivate':'Activate'}</button><button data-number-roster="${r.playerId}">Jersey</button><button data-remove-roster="${r.playerId}" class="danger">Remove</button></span></div>`}).join(''))}
$('rosterBtn').onclick=showRoster;$('newGame').onclick=()=>{if(!season())return alert('Create a season first.');if(!roster().some(r=>r.active))return alert('Add active players to the roster first.');popup('<h2>New game</h2>'+field('opponent','Opponent')+' '+field('gameDate','Date',new Date().toISOString().slice(0,10))+'<p><label>Periods <select id="gameFormat"><option value="4">Quarters</option><option value="2">Halves</option></select></label></p><button id="createGame" class="primary">Create game</button>')};$('homeBtn').onclick=$('backBtn').onclick=()=>{db.activeTeam=null;db.activeGame=null;resetClock();save();render()};$('themeBtn').onclick=()=>{db.dark=!db.dark;save();render()};$('seasonSelect').onchange=e=>{db.activeSeason=e.target.value;db.activeGame=null;resetClock();save();render()};$('gameSelect').onchange=e=>{db.activeGame=e.target.value||null;resetClock();save();render()};$('periodSelect').onchange=e=>{game().period=Number(e.target.value);resetClock();save();render()};$('nextPeriod').onclick=()=>{if(game().period<game().format){game().period++;resetClock();save();render()}};$('clockEnabled').onchange=e=>{game().clockEnabled=e.target.checked;save();render()};$('clockToggle').onclick=()=>{if(!game().clockEnabled)return alert('Enable the clock first.');if(timer)stopClock();else timer=setInterval(()=>{seconds++;$('clockDisplay').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000)};$('undoBtn').onclick=()=>{if(game()?.events.length){game().events.pop();save();render()}};$('columnsBtn').onclick=()=>popup('<h2>Visible statistics</h2>'+STATS.map(k=>`<label style="display:inline-block;margin:8px"><input type="checkbox" data-col="${k}" ${db.columns.includes(k)?'checked':''}> ${k}</label>`).join('')+'<p><button id="saveColumns" class="primary">Save columns</button></p>');$('closeModal').onclick=()=>$('modal').close();
$('modalBody').addEventListener('click',e=>{const b=e.target;if(b.id==='saveTeam'){const name=$('teamName').value.trim();if(!name)return alert('Enter a team name.');if(team())team().name=name;else{const t={id:id(),name};db.teams.push(t);db.activeTeam=t.id;db.activeSeason=null}save();$('modal').close();render()}if(b.id==='saveSeason'){const competition=$('competitionName').value.trim(),name=$('seasonName').value.trim();if(!competition||!name)return alert('Enter competition and season.');const s={id:id(),teamId:db.activeTeam,competition,name};db.seasons.push(s);db.activeSeason=s.id;db.activeGame=null;save();$('modal').close();render()}if(b.id==='savePlayer'){const name=$('playerName').value.trim();if(!name)return alert('Enter a name.');db.players.push({id:id(),name});save();showPlayers()}if(b.dataset.renamePlayer){const p=db.players.find(p=>p.id===b.dataset.renamePlayer),name=prompt('Player name',p.name);if(name?.trim()){p.name=name.trim();save();showPlayers()}}if(b.id==='newDirectoryPlayer'){const name=prompt('New player name');if(name?.trim()){db.players.push({id:id(),name:name.trim()});save();showRoster()}}if(b.id==='addRosterPlayer'){const playerId=$('rosterPlayer').value;if(!playerId)return alert('Create a player first.');db.rosters.push({teamId:db.activeTeam,seasonId:db.activeSeason,playerId,number:$('jersey').value.trim(),active:true});save();showRoster()}if(b.dataset.toggleRoster){const r=roster().find(r=>r.playerId===b.dataset.toggleRoster);r.active=!r.active;save();showRoster()}if(b.dataset.removeRoster){if(confirm('Remove from current roster? Past game stats will remain.')){db.rosters=db.rosters.filter(r=>!(r.teamId===db.activeTeam&&r.seasonId===db.activeSeason&&r.playerId===b.dataset.removeRoster));save();showRoster()}}if(b.dataset.numberRoster){const r=roster().find(r=>r.playerId===b.dataset.numberRoster),num=prompt('Jersey number',r.number);if(num!==null){r.number=num.trim();save();showRoster()}}if(b.id==='createGame'){const opponent=$('opponent').value.trim();if(!opponent)return alert('Enter opponent.');const g={id:id(),teamId:db.activeTeam,seasonId:db.activeSeason,opponent,date:$('gameDate').value,format:Number($('gameFormat').value),period:1,clockEnabled:false,playerSnapshot:players().map(p=>({id:p.id,name:p.name,number:p.number})),events:[]};db.games.push(g);db.activeGame=g.id;resetClock();save();$('modal').close();render()}if(b.id==='saveColumns'){db.columns=[...$('modalBody').querySelectorAll('[data-col]:checked')].map(x=>x.dataset.col);save();$('modal').close();render()}if(b.id==='saveEventEdit'){const ev=game().events.find(x=>x.id===$('editEventId').value);ev.type=$('editEventType').value;ev.points=ev.type==='OPP'?Number($('editPoints').value):ev.type==='2PM'?2:ev.type==='3PM'?3:ev.type==='FTM'?1:0;ev.period=Number($('editPeriod').value);save();$('modal').close();render()}});
document.addEventListener('click',e=>{const b=e.target;if(b.dataset.openTeam){db.activeTeam=b.dataset.openTeam;db.activeSeason=null;db.activeGame=null;save();render()}if(b.dataset.stat)addEvent(b.dataset.stat,b.dataset.player);if(b.dataset.opp){if(!game())return;game().events.push({id:id(),type:'OPP',points:Number(b.dataset.opp),playerId:null,period:game().period,at:new Date().toISOString(),clock:game().clockEnabled?seconds:null});save();render()}if(b.dataset.deleteEvent){if(confirm('Delete this event?')){game().events=game().events.filter(x=>x.id!==b.dataset.deleteEvent);save();render()}}if(b.dataset.editEvent){const ev=game().events.find(x=>x.id===b.dataset.editEvent);popup('<h2>Edit event</h2><input id="editEventId" type="hidden" value="'+esc(ev.id)+'"><p><label>Statistic <select id="editEventType">'+[...STATS,'OPP'].map(k=>`<option value="${k}" ${ev.type===k?'selected':''}>${esc(NAMES[k]||'Opposition score')}</option>`).join('')+'</select></label></p><p><label>Opposition points <input id="editPoints" type="number" min="0" max="3" value="'+ev.points+'"></label></p><p><label>Period <input id="editPeriod" type="number" min="1" max="'+game().format+'" value="'+ev.period+'"></label></p><button id="saveEventEdit" class="primary">Save changes</button>')}});
$('backupBtn').onclick=()=>download('courtside-backup.json',JSON.stringify(db,null,2),'application/json');$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.teams)||!Array.isArray(data.players)||!Array.isArray(data.games)||!Array.isArray(data.rosters)||!Array.isArray(data.seasons))throw Error('Invalid backup');if(confirm('Replace all local Version 2 data with this backup?')){db=data;resetClock();save();render()}}catch(err){alert('Could not restore: '+err.message)}e.target.value=''};function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('csvBtn').onclick=()=>{const rows=[['Team','Competition','Season','Date','Opponent','Player','Jersey','PTS',...STATS]];for(const g of db.games){const t=db.teams.find(x=>x.id===g.teamId),s=db.seasons.find(x=>x.id===g.seasonId);for(const p of g.playerSnapshot){const cnt={};for(const ev of g.events.filter(e=>e.playerId===p.id))cnt[ev.type]=(cnt[ev.type]||0)+1;rows.push([t?.name||'',s?.competition||'',s?.name||'',g.date,g.opponent,p.name,p.number||'',(cnt['2PM']||0)*2+(cnt['3PM']||0)*3+(cnt.FTM||0),...STATS.map(k=>cnt[k]||0)])}}const csv=rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');download('courtside-stats.csv','\ufeff'+csv,'text/csv;charset=utf-8')};render();
</script></body></html>
